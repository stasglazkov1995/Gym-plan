<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Програма тренувань для тенісу — 3 дні</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Тренажерний зал + теніс</h1>
  <div class="sub">3 дні на тиждень: пн / ср / пт. Підходи × повторення. Перед базовими вправами — 2 розминочні підходи (×15 легко, ×10 важче).</div>
  <div class="legend"><span><i style="background:var(--pri)"></i>основні м'язи</span><span><i style="background:var(--sec)"></i>допоміжні</span></div>
</header>
<nav><div class="in">
  <button data-d="mon" class="on">Пн · груди/біцепс</button>
  <button data-d="wed">Ср · спина/трицепс</button>
  <button data-d="fri">Пт · ноги/прес</button>
</div></nav>
<main id="main"></main>

<script src="script.js"></script>
</body>
</html>
